# /etc/nginx/sites-available/hms
# Reverse proxy to Gunicorn, with Nginx serving static/media directly.
#
# Replace <YOUR_DOMAIN_OR_IP> and <PROJECT_PATH> below, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/hms
#   sudo ln -s /etc/nginx/sites-available/hms /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 80;
    server_name <YOUR_DOMAIN_OR_IP>;

    client_max_body_size 20M;

    location /static/ {
        alias <PROJECT_PATH>/staticfiles/;
    }

    location /media/ {
        alias <PROJECT_PATH>/media/;
    }

    location / {
        proxy_pass http://unix:<PROJECT_PATH>/hms.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
