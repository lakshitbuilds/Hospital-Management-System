{% extends 'adminpanel/base.html' %}
{% load static %}

{% block title %}Generate Report - Admin Panel{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/adminpanel/list.css' %}">
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
    <div>
        <h4 class="adm-page-title">Generate Report</h4>
        <p class="adm-page-subtitle mb-0">
            Generate reports for patients, appointments, doctors, and billing.
        </p>
    </div>
</div>

<div class="adm-card">

    <div class="p-4">

        <form method="get" action="{% url 'generate_report' %}">

            <!-- Report Type -->
            <div class="mb-4">
                <label for="report_type" class="form-label fw-semibold">
                    Report Type
                </label>

                <select
                    name="report_type"
                    id="report_type"
                    class="form-select"
                    required
                >
                    <option value="" selected disabled>
                        Select Report Type
                    </option>
                    <option value="patients">
                        Patient Report
                    </option>
                    <option value="appointments">
                        Appointment Report
                    </option>
                    <option value="doctors">
                        Doctor Report
                    </option>
                    <option value="billing">
                        Billing Report
                    </option>
                </select>
            </div>


            <!-- Date Range -->
            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Date Range
                </label>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label
                            for="start_date"
                            class="form-label text-muted small"
                        >
                            Start Date
                        </label>

                        <input
                            type="date"
                            name="start_date"
                            id="start_date"
                            class="form-control"
                        >
                    </div>

                    <div class="col-md-6">
                        <label
                            for="end_date"
                            class="form-label text-muted small"
                        >
                            End Date
                        </label>

                        <input
                            type="date"
                            name="end_date"
                            id="end_date"
                            class="form-control"
                        >
                    </div>

                </div>

            </div>


            <!-- Status -->
            <div class="mb-4">

                <label
                    for="status"
                    class="form-label fw-semibold"
                >
                    Status
                </label>

                <select
                    name="status"
                    id="status"
                    class="form-select"
                >
                    <option value="">
                        All Status
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="confirmed">
                        Confirmed
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                    <option value="cancelled">
                        Cancelled
                    </option>

                    <option value="no_show">
                        No Show
                    </option>
                </select>

            </div>


        

            <!-- Actions -->
            <div class="d-flex justify-content-end gap-2 pt-2">

                <a
                    href="{% url 'admin_dashboard' %}"
                    class="btn btn-outline-secondary"
                >
                    <i class="bi bi-x-lg me-1"></i>
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    <i class="bi bi-file-earmark-bar-graph me-1"></i>
                    Generate Report
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
